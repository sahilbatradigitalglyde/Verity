<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verity Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F6F8;--sf:#FFFFFF;--sf2:#F0F1F4;--bd:#E2E4E9;--bd2:#CDD1D9;--tx:#111827;--mu:#596170;--ac:#3730A3;--acf:#3730A3;--acs:#EEF0FF;--on:#FFFFFF;--ps:#047857;--psb:#E6F5EE;--fl:#B42318;--flb:#FDECEA;--bk:#9A5B06;--bkb:#FEF4E2;--nr:#4B5563;--nrb:#EEF0F3;color-scheme:light}
:root[data-theme="dark"]{--bg:#0E1016;--sf:#161922;--sf2:#1D212C;--bd:#2A2F3B;--bd2:#3A4050;--tx:#E8EAF0;--mu:#9AA3B2;--ac:#A5A8FF;--acf:#5B5BD6;--acs:#23254A;--on:#FFFFFF;--ps:#4ADE9B;--psb:#0F2F23;--fl:#FF8A80;--flb:#3A1714;--bk:#F7C266;--bkb:#36270C;--nr:#B4BAC6;--nrb:#252A35;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.muted{color:var(--mu)}
.sm{font-size:12px}.s13{font-size:13px}
.b{font-weight:600}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.sp{flex:1 1 0}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
h2{margin:0;font-size:18px;font-weight:600}
h3{margin:0;font-size:16px;font-weight:600}
p{margin:0}
/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;padding:10px 28px;min-height:60px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;text-decoration:none;color:var(--tx)}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--acf);display:grid;place-items:center;color:#fff}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}
.nav a.on{background:var(--acs);color:var(--ac)}
.who{display:flex;align-items:center;gap:10px}
.who .n{display:flex;flex-direction:column;line-height:1.2}
.av{width:32px;height:32px;border-radius:999px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.av.s{width:24px;height:24px;font-size:10px}
.av-DO{background:#E0E7FF;color:#3730A3}.av-PS{background:#FCE7F3;color:#9D174D}.av-SP{background:#DCFCE7;color:#166534}.av-AI,.av-VY{background:var(--acf);color:#fff}.av-x{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
/* buttons */
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sf2)}
.btn.pri{background:var(--acf);border-color:var(--acf);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.warn{color:var(--bk);border-color:var(--bk)}
.btn.on{background:var(--acs);border-color:var(--acf);color:var(--ac);font-weight:600}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.lg{height:44px;padding:0 18px;font-size:15px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;filter:none}
.ib{width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--mu);display:inline-grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--sf2);border-color:var(--bd);color:var(--tx)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd)}
.seg button,.seg a{height:32px;padding:0 12px;border-radius:7px;border:0;background:transparent;color:var(--mu);font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.seg .on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* surfaces */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px}
.pad{padding:20px}
.sub{background:var(--sf);border-bottom:1px solid var(--bd)}
.wrap{max-width:1376px;margin:0 auto;padding:24px 28px 120px}
.sub .wrap{padding-bottom:18px}
.crumb{font-size:13px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--mu);text-decoration:none}.crumb a:hover{color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:22px;font-weight:600}
.tabs{display:flex;gap:24px;flex-wrap:wrap}
.tabs a{padding:12px 0;color:var(--mu);border-bottom:2px solid transparent;text-decoration:none;font-weight:500}
.tabs a.on{color:var(--ac);border-color:var(--acf)}
.cnt{margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--acs);font-size:12px;color:var(--ac)}
/* pills & tags */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-pass{background:var(--psb);color:var(--ps)}.p-fail{background:var(--flb);color:var(--fl)}.p-blk{background:var(--bkb);color:var(--bk)}.p-nr{background:var(--nrb);color:var(--nr)}.p-ac{background:var(--acs);color:var(--ac)}.p-acf{background:var(--acf);color:#fff}
.p-out{border:1px solid var(--acf);color:var(--ac)}.p-gray{border:1px solid var(--bd2);color:var(--mu)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:none}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;border:1px solid var(--bd2);white-space:nowrap;display:inline-block}
.tag.f{background:var(--sf2);border-color:var(--bd)}
.tag.ok{background:var(--psb);border-color:transparent;color:var(--ps);font-weight:600}
.tag.ed{background:var(--nrb);border-color:transparent;color:var(--nr);font-weight:600;font-size:11px}
.prio{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;justify-self:start;display:inline-block}
.prio.P1{background:var(--tx);color:var(--sf)}.prio.P2{background:var(--sf2);color:var(--tx);border:1px solid var(--bd2)}.prio.P3{color:var(--mu);border:1px solid var(--bd)}
.risk{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.r-High{background:var(--flb);color:var(--fl)}.r-Medium{background:var(--bkb);color:var(--bk)}.r-Low{background:var(--nrb);color:var(--nr)}
/* forms */
.input{height:38px;padding:0 12px;border:1px solid var(--bd2);border-radius:8px;background:var(--sf);color:var(--tx);outline:none;min-width:0}
.input:focus,textarea.input:focus{border-color:var(--acf);box-shadow:0 0 0 3px var(--acs)}
textarea.input{height:auto;padding:10px 12px;line-height:1.5;resize:vertical;width:100%}
select.input{padding-right:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.searchbox{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--bd2);border-radius:8px;background:var(--sf);color:var(--mu)}
.searchbox input{border:0;background:transparent;outline:none;width:100%;color:var(--tx)}
input[type=checkbox]{accent-color:var(--acf);width:17px;height:17px;margin:0;cursor:pointer}
/* tables */
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;font-weight:600;color:var(--mu);text-align:left;padding:10px 14px;background:var(--sf2);border-bottom:1px solid var(--bd);white-space:nowrap}
.t td{padding:13px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--sf2)}
.t tr.sel td{background:var(--acs)}
.bar{height:6px;border-radius:999px;background:var(--sf2);overflow:hidden;display:flex}
/* stepper */
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 0}
.stepper li{display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--mu)}
.stepper .d{width:24px;height:24px;border-radius:999px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--bd2);margin-right:8px}
.stepper li.done,.stepper li.cur{color:var(--tx)}
.stepper li.done .d{background:var(--acf);border-color:var(--acf);color:#fff}
.stepper li.cur .d{background:var(--acs);border:2px solid var(--acf);color:var(--ac)}
.stepper li.warn .d{background:var(--bkb);border:2px solid var(--bk);color:var(--bk)}
.stepper .ln{width:30px;height:2px;margin:0 10px;background:var(--bd);border-radius:2px}
.stepper li.done .ln{background:var(--acf)}
/* layouts */
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
.split>.side{flex:1 1 320px;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:16px}
.banner{padding:12px 16px;border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;line-height:1.5}
.b-ac{background:var(--acs);border:1px solid var(--acf)}.b-ok{background:var(--psb);border:1px solid var(--ps)}.b-warn{background:var(--bkb);border:1px solid var(--bk)}.b-gray{background:var(--sf2);border:1px solid var(--bd)}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.sec-h{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lbl{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
/* sign in */
.signin{min-height:100vh;display:flex;flex-wrap:wrap}
.signin .l{flex:1 1 520px;background:#3730A3;color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.signin .r{flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.ms{height:48px;border-radius:10px;border:1px solid var(--bd2);background:var(--sf);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;width:100%}
.ms:hover{background:var(--sf2)}
/* apps */
.grid-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.appcard{display:flex;flex-direction:column;gap:18px;padding:22px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);text-decoration:none;color:var(--tx)}
.appcard:hover{border-color:var(--acf)}
.ini{width:40px;height:40px;flex:none;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:15px;font-weight:700}
/* PR */
.pr{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.pr.sel{border-color:var(--acf)}
.pr.dis{opacity:.6}
.pr-h{display:flex;align-items:flex-start;gap:14px;padding:16px 18px}
.ai-note{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--acs);color:var(--ac);font-size:11px;font-weight:600;flex:none}
/* cases */
.case{padding:14px 16px;border-top:1px solid var(--bd)}
.case.ed{background:var(--acs)}
.case-top{display:grid;grid-template-columns:56px minmax(0,1fr) 96px 40px 160px 150px 136px;gap:12px;align-items:center}
.case-bot{display:grid;grid-template-columns:56px repeat(3,minmax(0,1fr));gap:12px;margin-top:10px;font-size:13px;line-height:1.5}
.case-bot ol{margin:0;padding-left:18px}
.chead{display:grid;grid-template-columns:56px minmax(0,1fr) 96px 40px 160px 150px 136px;gap:12px;padding:10px 16px;background:var(--sf2);font-size:12px;font-weight:600;color:var(--mu)}
/* execution */
.navlist button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;border-top:1px solid var(--bd);background:transparent;text-align:left;cursor:pointer;color:var(--tx)}
.navlist button:hover{background:var(--sf2)}
.navlist button.on{background:var(--acs);box-shadow:inset 3px 0 0 var(--acf)}
.stepchk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.stepchk.on{background:var(--sf2);color:var(--mu);text-decoration:line-through}
.stbtn{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;cursor:pointer;background:var(--sf);border:1px solid var(--bd2);color:var(--tx)}
.stbtn:disabled{cursor:not-allowed;opacity:.6}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px;border:1.5px dashed var(--bd2);border-radius:10px;background:var(--sf2);text-align:center;cursor:pointer}
.drop:hover{border-color:var(--acf)}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px}
.ft{width:36px;height:36px;border-radius:6px;background:var(--acs);color:var(--ac);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.segbar{display:grid;gap:3px}
.segbar span{height:8px;border-radius:3px}
/* report */
.ring{position:relative;width:148px;height:148px;flex:none}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.finding{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.finding:last-child{border-bottom:0}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;font-size:13px;line-height:1.5}
.cmp>div{padding:10px 12px;border-radius:8px;background:var(--sf2)}
/* overlays */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:100%;max-width:580px;max-height:calc(100vh - 32px);overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:0 24px 48px rgba(0,0,0,.22)}
.modal .mh{padding:20px 24px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal .mb{padding:4px 24px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 24px;border-top:1px solid var(--bd);background:var(--sf2);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.repo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--bd);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--tx)}
.repo:first-child{border-top:0}
.repo.on{background:var(--acs)}
.repo:disabled{opacity:.55;cursor:not-allowed}
.radio{width:18px;height:18px;border-radius:999px;border:2px solid var(--bd2);display:grid;place-items:center;flex:none}
.repo.on .radio{border-color:var(--acf)}
.repo.on .radio::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--acf)}
.drawer-bg{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--sf);border-left:1px solid var(--bd);z-index:41;display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.18)}
.ev{display:flex;gap:14px}
.ev .rail{flex:1;width:2px;min-height:12px;background:var(--bd);margin:4px 0}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--bd2);background:var(--sf);font-size:12px;font-weight:500;cursor:pointer}
.chip.on{background:var(--acf);border-color:var(--acf);color:#fff;font-weight:600}
.busy{position:fixed;inset:0;background:rgba(17,24,39,.5);display:grid;place-items:center;z-index:70;padding:16px}
.busy .box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:28px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 48px rgba(0,0,0,.25)}
.spin{width:22px;height:22px;border-radius:999px;border:3px solid var(--acs);border-top-color:var(--acf);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:560px}
.toast{background:var(--tx);color:var(--sf);padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;pointer-events:auto;line-height:1.45}
.toast button{background:transparent;border:0;color:var(--sf);font-weight:700;text-decoration:underline;cursor:pointer}
.guide{position:fixed;right:20px;bottom:20px;width:330px;z-index:30;background:var(--sf);border:1px solid var(--bd2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);overflow:hidden}
.guide .gh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--acf);color:#fff;cursor:pointer;border:0;width:100%;text-align:left}
.guide ol{list-style:none;margin:0;padding:6px}
.guide li button{width:100%;display:flex;gap:10px;align-items:flex-start;padding:8px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--tx);font-size:13px;line-height:1.4}
.guide li button:hover:not(:disabled){background:var(--sf2)}
.guide li button:disabled{cursor:default;opacity:.55}
.guide li.cur button{background:var(--acs)}
.guide .n{width:20px;height:20px;border-radius:999px;border:1.5px solid var(--bd2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.guide li.done .n{background:var(--ps);border-color:var(--ps);color:#fff}
.guide li.cur .n{border-color:var(--acf);color:var(--ac)}
.guide-min{position:fixed;right:20px;bottom:20px;z-index:30}
.aiopt{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--bd2);border-radius:12px;background:var(--sf);text-align:left;cursor:pointer;width:100%;color:var(--tx)}
.aiopt:hover{border-color:var(--acf);background:var(--acs)}
.aio-i{width:36px;height:36px;border-radius:9px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.hand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.hand>li{display:flex;gap:14px;align-items:flex-start}
.hn{width:26px;height:26px;border-radius:999px;background:var(--acf);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.prov{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
@media (max-width:760px){.hdr{padding:10px 16px}.wrap{padding:16px 16px 120px}.signin .l{padding:40px 24px}.guide{left:12px;right:12px;bottom:12px;width:auto}.cmp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const $ov = document.getElementById('overlay');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const dayLabel = () => new Date().toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const svg = (p, sw) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  check: svg('<path d="M4 12.5l5 5L20 6"/>', 2.6),

/* ---------- core ---------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', S.theme); try { localStorage.setItem('verity-theme', S.theme); } catch (e) {} }
function route(){ const h = location.hash.replace(/^#\/?/, ''); return h ? h.split('/') : [S.signedIn ? home() : 'signin']; }
function go(h){ if (location.hash === '#/' + h) render(); else location.hash = '#/' + h; }
function home(){ return S.role === 'tester' ? 'queue' : 'apps'; }
function log(who, what, detail, tag, tagCls, cat){ S.audit.push({who, what, detail:detail||'', tag:tag||'', tagCls:tagCls||'p-ac', cat:cat||'Workflow', time:now(), day:dayLabel()}); }
function toast(msg, actLabel, actKey){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>` + (actLabel ? `<button type="button" data-act="toast-act" data-k="${actKey}">${esc(actLabel)}</button>` : '');
  const box = document.getElementById('toast');
  while (box.children.length >= 2) box.firstChild.remove();
  box.appendChild(el);
  setTimeout(() => el.remove(), actLabel ? 6000 : 3800);
}
function setStatus(st){ S.cycle.status = st; }
function locked(){ return S.cycle && ['Submitted','AI Reviewed','Approved for UAT'].includes(S.cycle.status); }
function nextCaseId(){ const n = Math.max(0, ...S.cycle.cases.map(c => parseInt(c.id.slice(3), 10))) + 1; return 'TC-' + String(n).padStart(2, '0'); }
function newResult(){ return {status:'', actual:'', notes:'', bug:'', ev:[], chk:[]}; }

function render(){
  applyTheme();
  const a = document.activeElement; const fid = a && a.id; let ss = null, se = null;
  try { if (fid && a.selectionStart != null) { ss = a.selectionStart; se = a.selectionEnd; } } catch (e) {}
  const r = route();
  if (!S.signedIn && r[0] !== 'signin') { location.hash = '#/signin'; return; }
  let html = '';
  if (r[0] === 'signin') html = vSignin();
  else if (r[0] === 'apps') html = shell(vApps());
  else if (r[0] === 'app') html = shell(vAppDetail(r[1] || 'claims', r[2] || 'cycles'));
  else if (r[0] === 'cycle' && r[1] === 'new') html = shell(vNewCycle());
  else if (r[0] === 'cycle' && r[2] === 'review') html = shell(vReview());
  else if (r[0] === 'cycle' && r[2] === 'run') html = shell(vRun());
  else if (r[0] === 'cycle' && r[2] === 'report') html = shell(vReport());
  else if (r[0] === 'queue') html = shell(vQueue());
  else html = shell(`<div class="wrap">${empty('Page not found', 'Use the navigation above.')}</div>`);
  $app.innerHTML = html;
  renderOverlay();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} } }
}
function renderOverlay(){
  let h = '';
  if (S.signedIn && route()[0] !== 'signin') h += vGuide();
  if (S.drawer) h += vDrawer();
  if (S.modal) h += vModal();
  if (S.busy) h += vBusy();
  $ov.innerHTML = h;
}

      ${suggList.map(s => `<div class="row" style="padding:12px 16px;border-top:1px solid var(--bd)"><span class="mono sm muted" style="width:64px">${s.reg}</span><div class="col" style="flex:1 1 360px;min-width:0;gap:3px"><span style="font-weight:500">${s.title}</span><span class="s13 muted"><b style="color:var(--tx)">Match reason:</b> ${s.reason}</span></div><span class="sm muted">Last run ${s.last}</span>${S.suggAdded[s.reg] ? `<span class="pill p-pass">${I.check}Added as ${S.suggAdded[s.reg]}</span>` : `<button class="btn sm" type="button" data-act="add-sugg" data-id="${s.reg}" ${dis}>Add to cycle</button>`}</div>`).join('')}
    </div>` : '';
  return cycleHead('review') + `<div class="wrap split">

      <section class="card pad col" style="gap:14px">
        <div class="row" style="gap:8px"><span style="color:var(--ac)">${I.spark}</span><h3 style="font-size:15px">AI change summary</h3></div>
        <p style="line-height:1.6">${esc(c.summary || '')}</p>
        <div class="row" style="gap:8px"><span class="risk r-High">${riskN('High')} high risk</span><span class="risk r-Medium">${riskN('Medium')} medium</span><span class="risk r-Low">${riskN('Low')} low</span></div>

      <section class="card" style="overflow:hidden">
        <h3 style="font-size:15px;padding:16px 20px;border-bottom:1px solid var(--bd)">Changes by module</h3>
        ${getMods(c).map(m => `<div class="col" style="gap:6px;padding:14px 20px;border-bottom:1px solid var(--bd)"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="b">${esc(m.name)}</span><span class="risk r-${m.risk}">${m.risk} risk</span></div><p class="s13 muted" style="line-height:1.5">${esc(m.desc)}</p><span class="sm muted">${plural(counts[m.id] || 0, 'test case')} cover this</span></div>`).join('')}

          <div style="padding:0 12px 12px">${FILES.map(f => `<div class="row" style="gap:8px;padding:6px 8px;flex-wrap:nowrap"><span class="dot" style="border-radius:2px;background:${f[0] === 'A' ? 'var(--ps)' : 'var(--bk)'}" title="${f[0] === 'A' ? 'Added' : 'Modified'}"></span><span class="mono sm ell" style="flex:1">${f[1]}</span><span class="mono sm" style="color:var(--ps)">+${f[2]}</span><span class="mono sm" style="color:var(--fl)">−${f[3]}</span></div>`).join('')}</div>

              <button class="ib" type="button" data-act="case-del" data-id="${t.id}" aria-label="Delete ${t.id}" title="Delete" ${dis}>${I.trash}</button>
            </div>
          </div>

        <label class="f" style="flex:1 1 260px">Assign to tester<select id="assignTester" class="input"><option>Priya Shah</option><option>Tomás Rivera</option><option>Jordan Kim</option></select></label>

  const rows = [];

    const c = S.cycle, done = c.cases.filter(x => x.r.status).length;
    const tab = ['Assigned','In Testing','Changes Requested'].includes(c.status) ? 'Open' : c.status === 'Approved for UAT' ? 'Completed' : 'Submitted';
    rows.push({tab, app:'Claims Portal', pr:'PR #482', title:'Add partial refund support to claim settlement', status:c.status, done, total:c.cases.length, due:c.dueLabel, note:c.status === 'Changes Requested' ? c.changeComment : '', live:true, cta:c.status === 'Assigned' ? 'Start testing' : c.status === 'In Testing' ? 'Continue testing' : c.status === 'Changes Requested' ? 'Resume' : 'View'});
  }
  rows.push({tab:'Open', app:'Claims Portal', pr:'Release 2026.10.2', title:'October release candidate 2', status:'Changes Requested', done:31, total:38, due:'Today', note:'TC-22 says Pass but the actual result mentions a timeout. Re-run it and attach the API log.', cta:'Resume'});

function vRun(){
  const c = S.cycle;
  if (!c || c.status === 'Tests Generated') return cycleHeadMaybe() + `<div class="wrap">${empty('Not assigned yet', 'This cycle reaches the tester after the senior developer reviews the test cases and assigns them.', S.role === 'tester' ? `<button class="btn" type="button" data-act="switch-role" data-r="dev" data-h="${c ? 'cycle/482/review' : 'cycle/new'}">Switch to Daniel Okafor</button>` : '')}</div>`;
  const lock = locked();
  const canEdit = S.role === 'tester' && !lock;
  const dis = canEdit ? '' : 'disabled';
  if (S.runIdx >= c.cases.length) S.runIdx = 0;
  const t = c.cases[S.runIdx];
  const cnt = {pass:0, fail:0, blocked:0, na:0}; let done = 0;
  c.cases.forEach(x => { if (x.r.status) { done++; cnt[x.r.status]++; } });
  const ready = done === c.cases.length;
  if (t.r.chk.length !== t.steps.length) t.r.chk = t.steps.map((_, j) => !!t.r.chk[j]);
  let banner = '';
  if (S.role !== 'tester') banner = `<div class="banner b-gray s13">${I.info}<span style="flex:1">You are viewing ${esc(c.tester)}’s results. Only the assigned tester can record results.</span>${!lock ? `<button class="btn sm" type="button" data-act="switch-role" data-r="tester" data-h="cycle/482/run">Switch to ${esc(c.tester)}</button>` : ''}</div>`;
  else if (c.status === 'Changes Requested') banner = `<div class="banner b-warn s13" style="align-items:flex-start;flex-wrap:nowrap">${avatar('dev', true)}<span><b>Daniel Okafor requested changes:</b> ${esc(c.changeComment)}</span></div>`;
  else if (lock) banner = `<div class="banner ${c.status === 'Approved for UAT' ? 'b-ok' : 'b-ac'} s13">${I.info}<span style="flex:1">${c.status === 'Submitted' ? 'Submitted for review. Verity is running AI validation.' : c.status === 'AI Reviewed' ? 'Submitted. Waiting for Daniel Okafor to approve or request changes.' : 'Approved for client UAT. Results are read-only.'}</span>${c.status !== 'Submitted' ? `<button class="btn sm" type="button" data-act="switch-role" data-r="dev" data-h="cycle/482/report">Switch to Daniel Okafor</button>` : ''}</div>`;

    <div class="col" style="flex:1 1 380px;gap:8px">

      <div class="segbar" role="img" aria-label="Progress by test case" style="grid-template-columns:repeat(${c.cases.length},minmax(0,1fr))">${c.cases.map((x, i) => `<span style="background:${x.r.status ? RS[x.r.status][2] : i === S.runIdx ? 'var(--acf)' : 'var(--bd2)'}"></span>`).join('')}</div>
    </div>
    ${canEdit && !ready ? `<button class="btn sm" type="button" data-act="fill-sample">Prototype: fill sample results</button>` : ''}
    ${S.role === 'tester' && !lock ? `<div class="col" style="gap:4px;align-items:flex-end"><button class="btn pri" type="button" data-act="submit" ${ready ? '' : 'disabled'}>Submit for Review</button>${ready ? '' : `<span class="sm muted">${plural(c.cases.length - done, 'case')} still need a status</span>`}</div>` : ''}
  </div></div>
  <div class="wrap col">
    ${banner}

    <nav class="side card navlist" aria-label="Test cases" style="overflow:hidden;gap:0;flex-basis:300px">
      <div class="b" style="padding:14px 16px">Test cases</div>
      ${c.cases.map((x, i) => `<button type="button" data-act="run-pick" data-i="${i}" class="${i === S.runIdx ? 'on' : ''}" ${i === S.runIdx ? 'aria-current="true"' : ''}>
        <span class="dot" style="width:10px;height:10px;${x.r.status ? 'background:' + RS[x.r.status][2] : 'border:2px solid var(--bd2)'}"></span>
        <span class="col" style="flex:1;min-width:0;gap:2px"><span class="mono" style="font-size:11px;color:var(--mu)">${x.id} · ${x.pri}</span><span class="s13" style="font-weight:500;line-height:1.35">${esc(x.title)}</span></span>
        <span style="font-size:11px;font-weight:600;white-space:nowrap;color:${x.r.status ? RS[x.r.status][2] : 'var(--mu)'}">${x.r.status ? (x.r.status === 'na' ? 'N/A' : RS[x.r.status][0]) : 'Not run'}</span></button>`).join('')}

          <div style="padding:14px 16px;border-radius:10px;background:var(--acs)"><div class="lbl" style="color:var(--ac)">Expected result</div><span style="line-height:1.5">${esc(t.exp)}</span></div>

function analyze(c){
  const cs = c.cases, cnt = {pass:0, fail:0, blocked:0, na:0, none:0};
  cs.forEach(x => { cnt[x.r.status || 'none']++; });
  const pick = list => list.map(f => { const t = cs.find(x => x.id === f.id); return t ? Object.assign({}, t, {why:f.why}) : null; }).filter(Boolean);
  const consistency = c.ai ? pick(c.ai.consistency) : [];
  const gaps = c.ai ? pick(c.ai.gaps) : [];
  const issues = cs.filter(x => x.r.status === 'fail' || x.r.status === 'blocked');
  const mods = getMods(c).map(m => { const mc = cs.filter(x => x.mod === m.id); const p = mc.filter(x => x.r.status === 'pass').length, f = mc.filter(x => x.r.status === 'fail').length, b = mc.filter(x => x.r.status === 'blocked' || x.r.status === 'na').length; return Object.assign({}, m, {cases:mc.map(x => x.id).join(', ') || 'No cases', total:mc.length, p, f, b, verified:mc.length > 0 && p + f === mc.length}); });
  const highUnv = mods.filter(m => m.risk === 'High' && !m.verified).length;
  const obs = consistency.length + gaps.length;
  let score = 100 - 8 * cnt.fail - 6 * cnt.blocked - 2 * obs - 10 * highUnv - 2 * cnt.na;
  score = Math.max(0, Math.min(100, score));
  const p1fail = issues.some(x => x.r.status === 'fail' && x.pri === 'P1');
  const verdict = p1fail ? 'Not ready: a P1 case failed' : score >= 80 ? (obs ? `Ready for UAT with ${plural(obs, 'observation')}` : 'Ready for UAT') : score >= 65 ? 'Needs attention before UAT' : 'Not ready for UAT';
  const verified = mods.filter(m => m.verified).length;
  const highOk = mods.filter(m => m.risk === 'High').every(m => m.verified);
  let summary = highOk ? 'High-risk refund logic and validation are fully tested.' : 'At least one high-risk area is not fully verified.';
  if (cnt.fail) summary += ` ${plural(cnt.fail, 'case')} failed${issues.some(x => x.r.bug) ? ' with a bug logged' : ''}.`;
  if (cnt.blocked) summary += ` ${plural(cnt.blocked, 'case')} could not run, so ${cnt.blocked === 1 ? 'that area is' : 'those areas are'} unverified.`;
  if (!cnt.fail && !cnt.blocked) summary += ' Every case ran.';
  const p1pass = cs.filter(x => x.r.status === 'pass' && x.pri === 'P1');
  const parts = [
    ['Coverage of changed areas', Math.round(100 * verified / mods.length)],
    ['Result consistency', Math.max(0, 100 - 14 * consistency.length)],
    ['Evidence on high-priority cases', p1pass.length ? Math.round(100 * p1pass.filter(x => x.r.ev.length).length / p1pass.length) : 100],
    ['Outcomes', Math.round(100 * cnt.pass / cs.length)]
  ];
  return {cnt, consistency, gaps, issues, mods, score, verdict, summary, parts, obs, verified};
}
function scoreColor(s){ return s >= 80 ? 'var(--ps)' : s >= 65 ? 'var(--bk)' : 'var(--fl)'; }

const AI_TASKS = {
  gen:{name:'Generate test cases', key:'generate_test_cases', where:'New test cycle → Generate Test Cases with AI', who:'Senior Developer'},

function getMods(c){ return c && c.mods ? c.mods : MODS; }
function modOf(c, id){ return getMods(c).find(m => m.id === id) || {id, name:id, risk:'Low', desc:''}; }

const AZ_STEPS = {
  gen:['Reading diffs from Azure DevOps', 'Reading AI commit notes and linked work items', 'Sending to Azure OpenAI', 'Checking the response format', 'Matching against the regression suite'],
  regen:['Re-reading the diff', 'Sending to Azure OpenAI', 'Keeping your edited cases'],

  bug:['Collecting the failed case and evidence', 'Sending to Azure OpenAI'],

};
function aiAzure(task){

  runSteps('Azure OpenAI · ' + AI_TASKS[task].name, AZ_STEPS[task], 400, () => AI_APPLY[task](sampleResp(task, runId), {prov:'azure', runId, by:'ai', at:now()}));

function aiClaude(task){ S.modal = {type:'claude', task, runId:newRunId(task), text:'', errors:null}; renderOverlay(); }

function heur(c){
  const cs = c.cases;
  return {
    result_consistency: cs.filter(x => x.r.status === 'pass' && /moment|briefly|flicker|timeout|intermittent|but /i.test(x.r.actual)).map(x => ({case_id:x.id, reason:'The actual result describes behavior the expected result does not allow for, even if it settled later. A client user could see it. Confirm whether this is acceptable or should be a Fail.'})),
    evidence_gaps: cs.filter(x => x.r.status === 'pass' && x.pri === 'P1' && !x.r.ev.length).map(x => ({case_id:x.id, reason:`Marked Pass with no screenshot or log on a P1 case in ${modOf(c, x.mod).name.toLowerCase()} (${modOf(c, x.mod).risk.toLowerCase()} risk).`})),
    failures_and_blocked: cs.filter(x => x.r.status === 'fail' || x.r.status === 'blocked').map(x => ({case_id:x.id, explanation:AIX[x.id] || (x.r.status === 'fail' ? 'The actual result does not match the expected result in an area this PR changed. Check whether the defect is in the change or in the test data before approving.' : 'The case could not run, so this behavior is unverified. Run it in another environment or accept the risk explicitly.')}))
  };
}
function sampleResp(task, runId){
  const base = {run_id:runId, task:AI_TASKS[task].key, schema_version:'1.0'}, c = S.cycle;
  if (task === 'gen' || task === 'regen') return Object.assign(base, {
    change_summary:'Adjusters can now refund part of a settled claim instead of reversing the whole settlement. Refunds are stored in a new ledger, validated against the remaining balance, blocked on closed claims, and sent to Billing as an event. The settlement summary shows refunded and remaining amounts.',
    modules:MODS.map(m => ({id:m.id, name:m.name, risk:m.risk, description:m.desc})),
    test_cases:TPL.map(t => ({title:t[1], type:t[2], priority:t[3], module:t[6], linked_file:t[4], source:t[5], preconditions:t[7], steps:t[8], expected_result:t[9]})),
    regression_suggestions:SUGG.map(s => ({regression_id:s.reg, reason:s.reason}))
  });
  if (task === 'validate') { const h = heur(c); return Object.assign(base, {summary:'High-risk refund logic and validation were tested. Review the observations and the failed and blocked cases before approving.'}, h); }
  if (task === 'bug') { const t = c.cases[S.runIdx]; return Object.assign(base, {title:`${t.id} failed: ${t.title}`.slice(0, 90), severity:t.pri === 'P1' ? '2 - High' : '3 - Medium', area_path:'Claims\\Settlement', repro_steps:'Preconditions: ' + t.pre + '\n' + t.steps.map((s, i) => (i + 1) + '. ' + s).join('\n') + '\nExpected: ' + t.exp + '\nActual: ' + (t.r.actual || 'See attached evidence.')}); }
  if (task === 'dups') return Object.assign(base, {pairs:[{a:'REG-118', b:'REG-131', reason:'Both settle a claim for the full amount end to end and check the same outcome.'}, {a:'REG-201', b:'REG-209', reason:'Both check that an adjuster cannot edit a closed claim.'}].filter(p => S.regression.some(r => r.id === p.a) && S.regression.some(r => r.id === p.b))});

    else o.test_cases.forEach((t, i) => {

      if (!ENUM.type.includes(t.type)) e.push(`${p}.type must be one of: ${ENUM.type.join(', ')}.`);

      if (!t.expected_result) e.push(p + '.expected_result is missing.');

  },
  validate(o, e){

      else o[k].forEach((x, i) => { if (!S.cycle.cases.some(t => t.id === x.case_id)) e.push(`${k}[${i}].case_id "${x.case_id}" is not a case in this cycle.`); });
    });
  },
  bug(o, e){ if (!o.title) e.push('title is missing.'); if (!o.repro_steps) e.push('repro_steps is missing.'); },
  dups(o, e){ if (!Array.isArray(o.pairs)) e.push('pairs must be a list.'); else o.pairs.forEach((p, i) => [p.a, p.b].forEach(id => { if (!S.regression.some(r => r.id === id)) e.push(`pairs[${i}] refers to ${id}, which is not in the suite.`); })); }

function parseResp(task, runId, text){

  if (s < 0 || e < s) return {errors:['No JSON found. Paste Claude’s whole reply, including the json block.']};
  let o; try { o = JSON.parse(text.slice(s, e + 1)); } catch (err) { return {errors:['The JSON could not be read: ' + err.message]}; }
  const errs = [];
  if (o.run_id !== runId) errs.push(`run_id is "${o.run_id || 'missing'}" but this run is ${runId}. The reply may be from another run or an older prompt.`);
  if (o.task !== AI_TASKS[task].key) errs.push(`task is "${o.task || 'missing'}" but should be ${AI_TASKS[task].key}.`);

    toast(`${tester} was notified by email and in Teams.`); render();
  },
  'switch-role'(d){ setRole(d.r, d.h); },
  'queue-tab'(d){ S.queueTab = d.v; render(); },
  'run-pick'(d){ S.runIdx = +d.i; render(); },
  'run-prev'(){ S.runIdx = Math.max(0, S.runIdx - 1); render(); },
  'run-next'(){ S.runIdx = Math.min(S.cycle.cases.length - 1, S.runIdx + 1); render(); },
  'open-case'(d){ S.runIdx = S.cycle.cases.findIndex(x => x.id === d.id); go('cycle/482/run'); },
  'set-status'(d){
    const t = S.cycle.cases[S.runIdx]; const was = t.r.status;
    t.r.status = was === d.s ? '' : d.s;
    ensureInTesting();
    if (t.r.status) { const cls = {pass:'p-pass', fail:'p-fail', blocked:'p-blk', na:'p-nr'}[t.r.status]; log('tester', `Recorded ${t.id}${t.r.ev.length ? ' · ' + plural(t.r.ev.length, 'file') + ' attached' : ''}${t.r.bug ? ' · linked ' + t.r.bug : ''}`, t.r.actual, RS[t.r.status][0], cls, 'Results'); }
    render();
  },
  'fill-sample'(){
    let n = 0;
    S.cycle.cases.forEach(t => { if (t.r.status) return; const s = SAMPLE[t.id] || ['pass', 'Matches the expected result.', [t.id.toLowerCase() + '-result.png']]; t.r.status = s[0]; t.r.actual = s[1]; t.r.ev = s[2].slice(); t.r.bug = s[3] ? 'AB#' + S.bugSeq++ : ''; t.r.chk = t.steps.map(() => true); n++; });
    ensureInTesting();
    log('tester', `Recorded ${plural(n, 'result')}`, 'Filled with sample results in the prototype', '', '', 'Results');
    toast(`${plural(n, 'case')} filled. Review any case, then Submit for Review.`); render();
  },
  'create-bug'(){ aiStart('bug'); },
  'bug-save'(){ const t = S.cycle.cases[S.runIdx]; const id = 'AB#' + S.bugSeq++; t.r.bug = id; log('tester', `Created bug ${id} for ${t.id} in Azure DevOps`, document.getElementById('b-title').value, '', '', 'Results'); S.modal = null; toast(`Bug ${id} created in Azure DevOps and linked to PR #482.`); render(); },
  'ev-del'(d){ S.cycle.cases[S.runIdx].r.ev.splice(+d.k, 1); render(); },
  submit(){
    setStatus('Submitted'); log('tester', 'Submitted for review', '', 'In Testing → Submitted', 'p-ac', 'Workflow');
    if (S.aiMode.validate === 'azure') {
      toast('Submitted. Verity is running AI validation in Azure OpenAI.'); render();
      setTimeout(() => { if (S.cycle.status !== 'Submitted') return; const runId = newRunId('validate'); AI_APPLY.validate(sampleResp('validate', runId), {prov:'azure', runId, by:'ai', at:now()}); }, 2400);
    } else { toast('Submitted. Daniel Okafor will run the AI validation.', 'Switch to Daniel', 'report'); render(); }
  },
  'open-approve'(){ S.modal = {type:'approve', ok:false}; renderOverlay(); },
  'approve-save'(){
    const note = document.getElementById('ap-note').value.trim();
    Object.assign(S.cycle, {approvedNote:note, approvedAt:now()}); setStatus('Approved for UAT');
    log('dev', 'Approved for client UAT', note, 'AI Reviewed → Approved for UAT', 'p-pass', 'Approvals');
    log('sys', 'Set the verity/uat-ready check to succeeded on PR #482 in Azure DevOps', '', '', '', 'Approvals');
    S.modal = null; toast('Approved for client UAT. The client success team was notified.'); render();
  },
  'open-changes'(){ S.modal = {type:'changes'}; renderOverlay(); },
  'changes-save'(){
    const cm = document.getElementById('ch-c').value.trim() || 'Please review the AI findings.';
    S.cycle.changeComment = cm; setStatus('Changes Requested');
    log('dev', 'Requested changes', cm, 'AI Reviewed → Changes Requested', 'p-blk', 'Approvals');
    S.modal = null; toast(`Returned to ${S.cycle.tester}.`); render();
  },
  rerun(){ aiStart('validate'); },
  'reg-tag'(){ S.modal = {type:'tag'}; renderOverlay(); },
  'tag-save'(){ const v = document.getElementById('tag-v').value.trim().replace(/^#/, ''); if (v) S.regression.forEach(r => { if (S.regSel[r.id] && !r.tags.includes(v)) r.tags.push(v); }); S.modal = null; toast(`Tagged with #${v}.`); render(); },
  'reg-archive'(){ const ids = Object.keys(S.regSel).filter(k => S.regSel[k]); S.regression = S.regression.filter(r => !ids.includes(r.id)); S.regTotal -= ids.length; S.regSel = {}; toast(`${plural(ids.length, 'case')} archived.`); render(); },
  'reg-export'(){ const sel = S.regression.filter(r => S.regSel[r.id]); const rows = sel.length ? sel : regRows(); download('claims-portal-regression.csv', 'id,title,module,priority,last_run,last_result,source\n' + rows.map(r => [r.id, r.title, r.mod, r.pri, r.last, r.res, r.src].map(csv).join(',')).join('\n')); toast(`Exported ${plural(rows.length, 'case')} to CSV.`); },
  'reg-clear'(){ S.regSel = {}; render(); },
  merge(d){ S.modal = {type:'merge', id:d.id}; renderOverlay(); },
  'merge-save'(){ const m = S.modal; S.regression = S.regression.filter(r => r.id !== m.drop); S.regression.forEach(r => { if (r.dup === m.drop) r.dup = ''; }); S.regTotal--; S.modal = null; toast(`Merged. ${m.drop} archived, ${m.keep} kept.`); render(); },
  'guide-toggle'(){ S.guideOpen = !S.guideOpen; renderOverlay(); },
  'guide-go'(d){ if (d.r && d.r !== S.role) S.role = d.r; go(d.h); if (d.audit) setTimeout(() => A.audit(), 200); },
  reset(){ location.hash = ''; location.reload(); },
  'toast-act'(d){ if (toastActs[d.k]) toastActs[d.k](); }
};
function addSugg(reg){ const s = SUGG.find(x => x.reg === reg); const id = nextCaseId(); S.cycle.cases.push({id, title:s.title, type:'Regression', pri:s.pri, file:MODS.find(m => m.id === s.mod).name, src:'reg', mod:s.mod, pre:s.pre + ' Linked to ' + s.reg + '.', steps:s.steps.slice(), exp:s.exp, edited:false, promoted:true, r:newResult()}); S.suggAdded[reg] = id; log('dev', `Included regression case ${reg} as ${id}`, s.title, '', '', 'Test cases'); }
function csv(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function download(name, text, type){ try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:type || 'text/csv'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast('Download is not available in this preview.'); } }

const CH = {
  role(el){ setRole(el.value); },
  pr(el){ const p = PRS.find(x => x.num === +el.dataset.n); const all = p.commits.every(c => S.sel[c[0]]); p.commits.forEach(c => { S.sel[c[0]] = !all; }); render(); },
  commit(el){ S.sel[el.dataset.h] = el.checked; render(); },
  step(el){ const t = S.cycle.cases[S.runIdx]; t.r.chk[+el.dataset.j] = el.checked; render(); },
  evidence(el){ const t = S.cycle.cases[S.runIdx]; Array.from(el.files || []).forEach(f => t.r.ev.push(f.name)); render(); },
  'aa-org'(el){ S.modal.org = el.value; S.modal.proj = Object.keys(ADO[el.value])[0]; S.modal.repo = null; S.modal.name = ''; renderOverlay(); },
  'aa-proj'(el){ S.modal.proj = el.value; S.modal.repo = null; S.modal.name = ''; renderOverlay(); },
  'ap-ok'(el){ S.modal.ok = el.checked; renderOverlay(); },
  regmod(el){ S.regMod = el.value; render(); },
  regres(el){ S.regRes = el.value; render(); },
  'reg-sel'(el){ S.regSel[el.dataset.id] = el.checked; render(); },
  'reg-all'(el){ regRows().forEach(r => { S.regSel[r.id] = el.checked; }); render(); },
  'ai-mode'(el){ S.aiMode[el.dataset.task] = el.value; toast(`${AI_TASKS[el.dataset.task].name}: ${MODE_LABEL[el.value]}.`); },
  'cl-file'(el){ const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { S.modal.text = String(rd.result); S.modal.errors = null; renderOverlay(); }; rd.readAsText(f); }
};
const IN = {
  actual(el){ S.cycle.cases[S.runIdx].r.actual = el.value; },
  notes(el){ S.cycle.cases[S.runIdx].r.notes = el.value; },
  bug(el){ S.cycle.cases[S.runIdx].r.bug = el.value; },
  'aa-name'(el){ S.modal.name = el.value; },
  'cl-text'(el){ S.modal.text = el.value; },
  regq(el){ S.regQ = el.value; render(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; if (el.disabled) return; const fn = A[el.dataset.act]; if (fn) { if (el.tagName === 'A' || el.tagName === 'TR' || el.tagName === 'BUTTON') e.preventDefault(); fn(el.dataset, el, e); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && IN[el.dataset.input]) IN[el.dataset.input](el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.modal) { S.modal = null; renderOverlay(); } else if (S.drawer) { S.drawer = false; renderOverlay(); } } });
window.addEventListener('hashchange', () => { S.drawer = false; render(); window.scrollTo(0, 0); });
render();
</script>
</body>
