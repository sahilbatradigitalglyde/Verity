# CI for Verity: backend tests + frontend type-check and build on every PR and on main.
# Deployment stages are added in PLAN.md phase 8.5.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ci
    displayName: Build and test
    jobs:
      - job: backend
        displayName: Backend (pytest)
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.13' }
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
              pytest -q --junitxml=test-results.xml
            workingDirectory: backend
            displayName: Install and test
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: backend/test-results.xml

      - job: frontend
        displayName: Frontend (type-check + build)
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: '24.x' }
          - script: |
              npm ci
              npm run build
            workingDirectory: frontend
            displayName: Install and build
